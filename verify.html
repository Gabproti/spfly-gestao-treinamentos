<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificar certificado | SPFLY</title><link rel="icon" href="favicon.png"><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#20252b;background:#f4f6f8}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:650px;margin:5vh auto;background:#fff;border:1px solid #e1e5e9;border-radius:16px;padding:32px;box-shadow:0 8px 28px #00000010}.logo{width:210px;max-width:100%;background:#1b1e20;border-radius:8px;padding:12px}h1{font-size:26px;margin:28px 0 8px}.muted{color:#66717d;line-height:1.5}label{display:block;font-weight:700;margin:25px 0 8px}input{width:100%;padding:13px;border:1px solid #cdd5dc;border-radius:8px;font:inherit;text-transform:uppercase}button{background:#ed5a29;color:#fff;border:0;border-radius:8px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer;margin-top:14px}.result{margin-top:22px;border-radius:10px;padding:17px;background:#f4f6f8;line-height:1.6}.valid{background:#e7f7ed;color:#17663e}.invalid{background:#fff0ee;color:#a33425}a{color:#cf481d}
</style></head><body><main class="wrap"><img class="logo" src="spfly_logo.png" alt="SPFLY"><h1>Verificar certificado</h1><p class="muted">Informe o código impresso no certificado oficial de conclusão da trilha. A consulta exibe apenas os dados necessários para confirmar sua autenticidade.</p><form id="form"><label for="code">Código do certificado</label><input id="code" maxlength="36" pattern="[A-Fa-f0-9]{36}" required autocomplete="off"><button type="submit">Verificar</button></form><div id="result" class="result" role="status" hidden></div><p class="muted"><a href="index.html">Voltar ao portal SPFLY</a></p></main><script src="config.js"></script><script>
const form=document.getElementById('form'),field=document.getElementById('code'),result=document.getElementById('result');
function show(message,tone){result.textContent=message;result.className='result '+(tone||'');result.hidden=false}
form.addEventListener('submit',async event=>{event.preventDefault();const code=field.value.trim().toUpperCase();if(!/^[A-F0-9]{36}$/.test(code)){show('Código inválido. Confira os 36 caracteres.','invalid');return}show('Consultando...');try{const cfg=window.SPFLY_CONFIG;const response=await fetch(cfg.url+'/rest/v1/rpc/cap_verify_official_certificate_v49',{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.publishableKey},body:JSON.stringify({certificate_code:code})});if(!response.ok)throw new Error('Serviço indisponível');const data=await response.json();if(!data?.found){show('Certificado não encontrado. Confira o código.','invalid');return}show(data.valid?`Certificado válido. ${data.employee} — ${data.track}. Conclusão: ${new Date(data.completed_at).toLocaleDateString('pt-BR')}. Código: ${data.code}.`:`Certificado invalidado. Código: ${data.code}.` ,data.valid?'valid':'invalid')}catch{show('Não foi possível consultar agora. Tente novamente mais tarde.','invalid')}});
const supplied=new URLSearchParams(location.search).get('code');if(supplied){field.value=supplied;form.requestSubmit()}
</script></body></html>
